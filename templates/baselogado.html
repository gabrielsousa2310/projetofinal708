
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Auto</title>

    <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f6e0.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        .sidebar .nav-link {
            color: #fff;
            transition: .2s;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .sidebar .nav-link i {
            flex-shrink: 0;
        }

        .sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, .15);
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* no computador: menu fixo na lateral */
        @media (min-width: 992px) {
            .sidebar-wrap {
                width: 250px;
                min-height: 100vh;
                flex-shrink: 0;
                background-color: #212529;
            }
        }
    </style>
</head>

<body>

    <!-- Barra do topo: aparece só no celular/tablet -->
    <nav class="navbar bg-dark navbar-dark d-lg-none">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">SuperOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                aria-controls="menuLateral" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="d-lg-flex">

        <div class="sidebar-wrap text-white">
            <div class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="menuLateral"
                style="--bs-offcanvas-bg:#212529; --bs-offcanvas-color:#fff; --bs-offcanvas-width:260px;">

                <!-- cabeçalho do menu: só no celular -->
                <div class="offcanvas-header d-lg-none">
                    <h5 class="offcanvas-title">SuperOS</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        data-bs-target="#menuLateral" aria-label="Fechar"></button>
                </div>

                <div class="offcanvas-body d-block p-3">

                    <!-- logo grande: só no computador -->
                    <a href="{{ url_for('dashboard') }}"
                        class="d-none d-lg-block text-white text-decoration-none fw-bold fs-1 mb-4">
                        SuperOS
                    </a>

                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('cadastro_clientes') }}">
                                <i class="bi bi-person-plus me-2"></i>
                                Cadastrar clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('listar_clientes_ativos') }}">
                                <i class="bi bi-person-plus me-2"></i>
                                Clientes ativos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('listar_clientes_inativos') }}">
                                <i class="bi bi-person-x text-white me-2"></i>
                                Clientes inativos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('cadastro_funcionarios') }}">
                                <i class="bi bi-person me-2"></i>
                                Cadastrar funcionarios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('listar_funcionarios_ativos') }}">
                                <i class="bi bi-person me-2"></i>
                                Funcionarios ativos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('listar_funcionarios_inativos') }}">
                                <i class="bi bi-person me-2"></i>
                                Funcionarios inativos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('registro_os') }}">
                                <i class="bi bi-clipboard me-2"></i>
                                Registrar OS
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="{{ url_for('cadastro_veiculos') }}">
                                <i class="bi bi-truck me-2"></i>
                                Cadastro de veículos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link rounded p-2" href="#">
                                <i class="bi bi-box me-2"></i>
                                Estoque
                            </a>
                        </li>

                        <li class="nav-item mt-5">
                            <a class="nav-link rounded p-2" href="{{ url_for('sair') }}">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Sair
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- conteúdo das páginas -->
        <div class="flex-grow-1" style="min-width: 0;">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
